<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanapay - Secure Escrow & Social Commerce Platform</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.05em;
        }

        nav button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 0.75rem;
            font-size: 0.85rem;
            width: auto;
            margin-top: 0;
        }

        nav button.active, nav button:hover {
            background-color: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .portal-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .product-summary {
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
        }

        .product-summary p {
            margin: 0.5rem 0;
            display: flex;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #475569;
            background: var(--bg-dark);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button.action-btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-pay, .btn-create {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-pay:hover, .btn-create:hover {
            background-color: var(--primary-dark);
        }

        .btn-dispute {
            background-color: transparent;
            color: #f87171;
            border: 1px solid #7f1d1d;
            margin-top: 0.75rem;
        }

        .btn-dispute:hover {
            background-color: #7f1d1d22;
        }

        #status-message, #link-output {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Amanapay</div>
        <nav>
            <button id="nav-vendor" onclick="switchView('vendor')">Vendor Portal</button>
            <button id="nav-buyer" class="active" onclick="switchView('buyer')">Buyer Checkout</button>
        </nav>
    </header>

    <main>
        <!-- PORTAL 1: VENDOR LINK CREATOR -->
        <div id="vendor-portal" class="portal-container hidden">
            <h2>Create Escrow Link</h2>
            <form id="vendor-form">
                <div class="form-group">
                    <label for="item-name">Item / Service Name</label>
                    <input type="text" id="item-name" placeholder="e.g., Oversized Vintage Hoodie" required>
                </div>
                <div class="form-group">
                    <label for="item-amount">Amount (KES)</label>
                    <input type="number" id="item-amount" placeholder="2537.50" required>
                </div>
                <button type="submit" class="action-btn btn-create">Generate Checkout Link</button>
            </form>
            <div id="link-output"></div>
        </div>

        <!-- PORTAL 2: BUYER CHECKOUT & DISPUTE -->
        <div id="buyer-portal" class="portal-container">
            <h2>Secure Escrow Checkout</h2>
            
            <div class="product-summary">
                <p><span>Item:</span> <strong id="display-item">Oversized Vintage Hoodie</strong></p>
                <p><span>Amount:</span> <strong id="display-amount">KES 2,537.50</strong></p>
                <p><span>Escrow Status:</span> <strong style="color: #38bdf8;">Protected</strong></p>
            </div>

            <form id="payment-form">
                <div class="form-group">
                    <label for="phone">M-Pesa Phone Number</label>
                    <input type="text" id="phone" value="254795209859" placeholder="2547XXXXXXXX" required>
                </div>

                <button type="submit" class="action-btn btn-pay" id="pay-btn">Pay with M-Pesa STK Push</button>
                <button type="button" class="action-btn btn-dispute" onclick="handleRaiseDispute()">Raise a Dispute Instead</button>
            </form>

            <div id="status-message"></div>

            <!-- Official IntaSend Trust Badge Integration -->
            <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.1); text-align: center;">
                <a href="https://intasend.com/security" target="_blank">
                    <img src="https://intasend-prod-static.s3.amazonaws.com/img/trust-badges/intasend-trust-badge-with-mpesa-hr-dark.png" width="375px" alt="IntaSend Secure Payments (PCI-DSS Compliant)" style="max-width: 100%; height: auto;">
                </a>
                <strong style="display: block; color: #fafafa; text-decoration: none; font-size: 0.8em; margin-top: 0.6em;">
                    <a href="https://intasend.com/security" target="_blank" style="color: #fafafa; text-decoration: none;">Secured by IntaSend Payments</a>
                </strong>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Amanapay. All rights reserved. Built with high-integrity infrastructure.
    </footer>

    <script>
        // Check URL parameters on load to see if a buyer link was generated with custom items
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const item = urlParams.get('item');
            const amount = urlParams.get('amount');

            if (item && amount) {
                document.getElementById('display-item').textContent = decodeURIComponent(item);
                document.getElementById('display-amount').textContent = `KES ${Number(amount).toLocaleString()}`;
            }
        });

        function switchView(view) {
            const vendorPortal = document.getElementById('vendor-portal');
            const buyerPortal = document.getElementById('buyer-portal');
            const navVendor = document.getElementById('nav-vendor');
            const navBuyer = document.getElementById('nav-buyer');

            if (view === 'vendor') {
                vendorPortal.classList.remove('hidden');
                buyerPortal.classList.add('hidden');
                navVendor.classList.add('active');
                navBuyer.classList.remove('active');
            } else {
                vendorPortal.classList.add('hidden');
                buyerPortal.classList.remove('hidden');
                navVendor.classList.remove('active');
                navBuyer.classList.add('active');
            }
        }

        // Vendor link generator form handler
        document.getElementById('vendor-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const itemName = document.getElementById('item-name').value;
            const itemAmount = document.getElementById('item-amount').value;

            const baseUrl = window.location.origin + window.location.pathname;
            const generatedLink = `${baseUrl}?item=${encodeURIComponent(itemName)}&amount=${encodeURIComponent(itemAmount)}`;

            const linkOutput = document.getElementById('link-output');
            linkOutput.style.color = "#4ade80";
            linkOutput.innerHTML = `Link Created Successfully!<br><input type="text" readonly value="${generatedLink}" style="margin-top:0.5rem; text-align:center; font-size:0.8rem;" onclick="this.select();">`;
        });

        // Buyer payment form handler
        document.getElementById('payment-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const payBtn = document.getElementById('pay-btn');
            const statusDiv = document.getElementById('status-message');
            const currentAmountText = document.getElementById('display-amount').textContent;
            const rawAmount = parseFloat(currentAmountText.replace(/[^0-9.]/g, '')) || 2537.50;

            payBtn.disabled = true;
            payBtn.textContent = "Sending STK Push...";
            statusDiv.style.color = "#38bdf8";
            statusDiv.textContent = "Please check your phone for the M-Pesa prompt.";

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: phone,
                        amount: rawAmount
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusDiv.style.color = "#4ade80";
                    statusDiv.textContent = "STK Push sent successfully! Enter your PIN.";
                } else {
                    throw new Error(data.error || "Payment initiation failed");
                }
            } catch (error) {
                statusDiv.style.color = "#f87171";
                statusDiv.textContent = "Error: " + error.message;
            } finally {
                payBtn.disabled = false;
                payBtn.textContent = "Pay with M-Pesa STK Push";
            }
        });

        function handleRaiseDispute() {
            const phoneNumber = document.getElementById('phone').value;
            const item = document.getElementById('display-item').textContent;
            const amount = document.getElementById('display-amount').textContent;
            
            const message = `Hello Amanapay Support, I want to raise a dispute for my order.\n\nItem: ${item}\nAmount: ${amount}\nPhone: ${phoneNumber}\nReason: Item not as described / Defective.`;
            
            const whatsappUrl = `https://wa.me/254795209859?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>

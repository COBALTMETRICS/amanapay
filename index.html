<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanapay - Secure Escrow Checkout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .checkout-container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.5rem;
            text-align: center;
        }
        .product-summary {
            background: #334155;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .product-summary p {
            margin: 0.4rem 0;
            display: flex;
            justify-content: space-between;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #475569;
            background: #0f172a;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .btn-pay {
            background-color: #0284c7;
            color: #ffffff;
        }
        .btn-pay:hover {
            background-color: #0369a1;
        }
        .btn-dispute {
            background-color: transparent;
            color: #f87171;
            border: 1px solid #7f1d1d;
            margin-top: 0.75rem;
        }
        .btn-dispute:hover {
            background-color: #7f1d1d22;
        }
        #status-message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2>Amanapay Checkout</h2>
        
        <div class="product-summary">
            <p><span>Item:</span> <strong>Oversized Vintage Hoodie</strong></p>
            <p><span>Amount:</span> <strong>KES 2,537.50</strong></p>
            <p><span>Escrow Status:</span> <strong style="color: #38bdf8;">Protected</strong></p>
        </div>

        <form id="payment-form">
            <div class="form-group">
                <label for="phone">M-Pesa Phone Number</label>
                <input type="text" id="phone" value="254795209859" placeholder="2547XXXXXXXX" required>
            </div>

            <button type="submit" class="btn-pay" id="pay-btn">Pay with M-Pesa STK Push</button>
            <button type="button" class="btn-dispute" onclick="handleRaiseDispute()">Raise a Dispute Instead</button>
        </form>

        <div id="status-message"></div>

        <!-- Official IntaSend Trust Badge Integration -->
        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.1); text-align: center;">
            <a href="https://intasend.com/security" target="_blank">
                <img src="https://intasend-prod-static.s3.amazonaws.com/img/trust-badges/intasend-trust-badge-with-mpesa-hr-dark.png" width="375px" alt="IntaSend Secure Payments (PCI-DSS Compliant)" style="max-width: 100%; height: auto;">
            </a>
            <strong style="display: block; color: #fafafa; text-decoration: none; font-size: 0.8em; margin-top: 0.6em;">
                <a href="https://intasend.com/security" target="_blank" style="color: #fafafa; text-decoration: none;">Secured by IntaSend Payments</a>
            </strong>
        </div>
    </div>

    <script>
        document.getElementById('payment-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const payBtn = document.getElementById('pay-btn');
            const statusDiv = document.getElementById('status-message');

            payBtn.disabled = true;
            payBtn.textContent = "Sending STK Push...";
            statusDiv.style.color = "#38bdf8";
            statusDiv.textContent = "Please check your phone for the M-Pesa prompt.";

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: phone,
                        amount: 2537.50
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusDiv.style.color = "#4ade80";
                    statusDiv.textContent = "STK Push sent successfully! Enter your PIN.";
                } else {
                    throw new Error(data.error || "Payment initiation failed");
                }
            } catch (error) {
                statusDiv.style.color = "#f87171";
                statusDiv.textContent = "Error: " + error.message;
            } finally {
                payBtn.disabled = false;
                payBtn.textContent = "Pay with M-Pesa STK Push";
            }
        });

        function handleRaiseDispute() {
            const phoneNumber = document.getElementById('phone').value;
            const item = "Oversized Vintage Hoodie";
            const amount = "KES 2,537.50";
            
            const message = `Hello Amanapay Support, I want to raise a dispute for my order.\n\nItem: ${item}\nAmount: ${amount}\nPhone: ${phoneNumber}\nReason: Item not as described / Defective.`;
            
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
